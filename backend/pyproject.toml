[project]
name = "anylo-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "S608"]  # SQL built from in-repo constants only
"app/rls.py" = ["S608", "E501"]  # policy SQL built from constants
"tests/*" = ["E501", "S608"]
"app/services/*.py" = ["E501"]  # long SQL strings read better unwrapped
"app/permissions.py" = ["E741"]  # O/M/S role shorthands mirror the docs matrix

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
