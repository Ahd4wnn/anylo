[project]
name = "anylo-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "S608"]  # SQL built from in-repo constants only
"app/rls.py" = ["S608", "E501"]  # policy SQL built from constants
"tests/*" = ["E501", "S608", "E731"]
"app/services/*.py" = ["E501"]  # long SQL strings read better unwrapped
"app/services/shop.py" = ["E501", "S608"]  # column list constant interpolated into SQL
"app/services/catalogue*.py" = ["E501", "S608"]
# WHERE clauses / column lists assembled from in-code constants; values are always bound parameters.
"app/services/{customers,backoffice,labour,returns,purchasing}.py" = ["E501", "S608"]
"app/routers/*.py" = ["E501"]
"app/schemas/*.py" = ["E501"]
"app/services/sales.py" = ["E501", "S608"]  # fixed WHERE fragments; values always bound
"app/services/snap.py" = ["E501", "S608"]  # placeholder names generated, values bound  # column lists / fixed WHERE fragments; values always bound
"app/data/*" = ["E501"]  # data tables
"app/permissions.py" = ["E741"]  # O/M/S role shorthands mirror the docs matrix

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.services.invoice_pdf"]
disallow_untyped_calls = false  # reportlab ships no type hints

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
